<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cartes Membres Kéwéré - PDF Recto/Verso CEDEAO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
.main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 20px; margin-top: 20px; flex-wrap: wrap; }

.form-right {
  display: flex; flex-direction: column; gap: 8px; width: 260px;
  background: #f4f6f9; padding: 15px; border-radius: 10px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}
.form-right label { font-size: 12px; font-weight: bold; }
.form-right input, .form-right select { padding: 7px; border-radius: 5px; border: 1px solid #ccc; font-size: 12px; }
.form-right button { margin-top: 10px; padding: 8px; background-color: #004080; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
.form-right button:hover { background-color: #0066cc; }

.cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 85.6mm);
  gap: 5mm;
  position: relative;
}

/* Cartes CEDEAO */
.carte-membre, .verso {
    width: 85.6mm;
    height: 54mm;
    border-radius: 4mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px;
    font-size: 8px;
    position: relative;
    page-break-inside: avoid;
    overflow: hidden;
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
.carte-membre { background-color: #fffacd; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
.carte-membre::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 70%; height: 70%;
    background: url('assets/logos/logokwr.png') no-repeat center center;
    background-size: contain;
    opacity: 0.15; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 0;
}
.carte-header { display: flex; justify-content: space-between; align-items: center; background: #004080; padding: 2px 4px; color: #fff; border-radius: 4px 4px 0 0; font-size: 8px; }
.carte-header .logo { width: 20px; }
.header-text { text-align: center; flex-grow: 1; font-weight: bold; }
.sub-title { font-size: 7px; }
.carte-body { display: flex; gap: 4px; flex: 1; z-index: 1; position: relative; }
.photo { width: 40px; height: 50px; border-radius: 3px; overflow: hidden; background: #fff; border: 1px solid #ccc; flex-shrink: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.infos { flex: 1; display: flex; flex-direction: column; gap: 2px; z-index: 1; }
.main-title-card { text-align: center; font-weight: bold; color: #004080; font-size: 9px; margin-bottom: 2px; }
.info-row { display: flex; justify-content: space-between; font-size: 7px; }
.label { font-weight: 600; color: #333; }
.value { font-weight: 500; text-align: right; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.id-highlight { color: #004080; font-weight: bold; }
.recto-qr { position: absolute; bottom: 2mm; right: 2mm; width: 12mm; height: 12mm; }

.verso { background: #e8f0f8; align-items: center; padding: 4px; border-radius: 4mm; }
.verso-header { text-align: center; font-weight: bold; font-size: 8px; margin-bottom: 2px; color: #004080; }
.verso-logo { width: 30px; margin: 2px 0; }
.info-dates { width: 100%; display: flex; justify-content: space-between; font-size: 7px; margin-top: 2px; color: #333; }
.signature { text-align: center; font-size: 6px; margin-top: 2px; color: #333; }

@media print {
  @page { size: A4 landscape; margin: 5mm; }
  body { margin: 0; padding: 0; }
  .cards-container, .form-right, #printBtn, #pdfBtn { display: none; }
}

@media (max-width: 700px) { .main-layout { flex-direction: column; align-items: center; } .form-right, .cards-container { width: 100%; max-width: 350px; } }
</style>
</head>
<body>

<h2 class="title">Générateur de Cartes Membres Kéwéré - PDF Recto/Verso CEDEAO</h2>

<div class="main-layout">
<form id="memberForm" class="form-right">
<label>Nom</label><input type="text" id="nom" required>
<label>Prénom</label><input type="text" id="prenom" required>
<label>Date de naissance</label><input type="date" id="dob" required>
<label>Sexe</label>
<select id="sexe" required>
<option value="">Sélectionner</option>
<option value="Masculin">Masculin</option>
<option value="Féminin">Féminin</option>
</select>
<label>Pays de résidence</label><input type="text" id="pays" required>
<label>Fonction</label><input type="text" id="fonction" required>
<label>Photo du membre</label><input type="file" id="photo" accept="image/*">
<button type="submit">Ajouter la carte</button>
<button type="button" id="printBtn" onclick="window.print()">🖨️ Imprimer toutes les cartes</button>
<button type="button" id="pdfBtn">📄 Enregistrer en PDF</button>
</form>

<div class="cards-container" id="cardsContainer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const form = document.getElementById("memberForm");
const cardsContainer = document.getElementById("cardsContainer");
const pdfBtn = document.getElementById("pdfBtn");
const drapeaux = { "sénégal": "assets/logos/gn.png", "guinée": "assets/logos/logokwr.png" };

form.addEventListener("submit", function(e){
  e.preventDefault();
  const nom = document.getElementById("nom").value;
  const prenom = document.getElementById("prenom").value;
  const dob = document.getElementById("dob").value;
  const sexe = document.getElementById("sexe").value;
  const pays = document.getElementById("pays").value;
  const fonction = document.getElementById("fonction").value;
  const id = "MEM" + Date.now().toString().slice(-6);
  const today = new Date();
  const emission = today.toISOString().split('T')[0];
  const expiration = new Date(today); expiration.setFullYear(today.getFullYear()+2);
  const exp = expiration.toISOString().split('T')[0];

  let photoURL = "";
  const photoInput = document.getElementById("photo");

  const addCard = () => {
    const wrapper = document.createElement("div");
    wrapper.innerHTML = `
      <div class="carte-membre">
        <div class="carte-header">
          <img src="${drapeaux[pays.toLowerCase()] || drapeaux['sénégal']}" class="logo">
          <div class="header-text"><div class="sub-title">RÉPUBLIQUE DE GUINÉE</div></div>
          <img src="assets/logos/logokwr.png" class="logo">
        </div>
        <div class="carte-body">
          <div class="photo"><img src="${photoURL}" alt="Photo"></div>
          <div class="infos"> 
            <div class="main-title-card">KÉWÉRÉ</div>
            <div class="info-row"><span class="label">Nom</span><span class="value">${nom}</span></div>
            <div class="info-row"><span class="label">Prénom</span><span class="value">${prenom}</span></div>
            <div class="info-row"><span class="label">ID</span><span class="value id-highlight">${id}</span></div>
            <div class="info-row"><span class="label">Naissance</span><span class="value">${dob}</span></div>
            <div class="info-row"><span class="label">Sexe</span><span class="value">${sexe}</span></div>
            <div class="info-row"><span class="label">Pays</span><span class="value">${pays}</span></div>
            <div class="info-row"><span class="label">Fonction</span><span class="value">${fonction}</span></div>
            <div class="recto-qr" id="qr-${id}"></div>
          </div>
        </div>
      </div>

      <div class="verso">
        <div class="verso-header">VILLAGE DE KÉWÉRÉ — CARTE OFFICIELLE</div>
        <img src="assets/logos/logokwr.png" class="verso-logo">
        <div class="info-dates">
          <span>Émission: ${emission}</span>
          <span>Expiration: ${exp}</span>
        </div>
        <div class="signature">Signature autorisée</div>
      </div>
    `;
    cardsContainer.appendChild(wrapper);
    new QRCode(document.getElementById(`qr-${id}`), { text: "https://kewere.vercel.app", width: 48, height: 48 });
    form.reset();
  }

  if(photoInput.files && photoInput.files[0]){
    const reader = new FileReader();
    reader.onload = e => { photoURL = e.target.result; addCard(); };
    reader.readAsDataURL(photoInput.files[0]);
  } else addCard();
});

// PDF côté à côté recto-verso
pdfBtn.addEventListener("click", () => {
  const pageWidth = 297; // mm A4 paysage
  const pageHeight = 210; // mm A4 paysage
  const cardWidthMM = 85.6;
  const cardHeightMM = 54;
  const gapMM = 5;

  const cards = document.querySelectorAll("#cardsContainer > div");
  const pdfContainer = document.createElement("div");
  pdfContainer.style.display = "flex";
  pdfContainer.style.flexWrap = "wrap";
  pdfContainer.style.width = `${pageWidth}mm`;
  pdfContainer.style.minHeight = `${pageHeight}mm`;
  pdfContainer.style.boxSizing = "border-box";

  cards.forEach((card, index) => {
    const wrapper = card.cloneNode(true);
    wrapper.style.width = `${cardWidthMM}mm`;
    wrapper.style.height = `${cardHeightMM*2 + gapMM}mm`; // recto + verso
    wrapper.style.marginRight = `${gapMM}mm`;
    wrapper.style.marginBottom = `${gapMM}mm`;
    wrapper.style.boxSizing = "border-box";

    pdfContainer.appendChild(wrapper);
  });

  html2pdf().set({
    margin: 5,
    filename: 'cartes_kewere_recto_verso.pdf',
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
    html2canvas: { scale: 3, useCORS: true, backgroundColor: null },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  }).from(pdfContainer).save();
});

</script>
</body>
</html>
